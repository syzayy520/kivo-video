<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>kivo 首页 · 桌面视觉稿</title>
<!--
  kivo 首页 · 桌面端视觉稿（设计阶段，静态预览）
  画布宽度：1440px；内容容器：1280px（左右各 80px）；12 栏 / 栏间距 24px
  风格来源：iOS 首页截图 10 张（docs 外部素材，仅参考风格）
  说明：所有图片均为带尺寸标注的占位 div；无任何外链；JS 只用于演示交互
-->
<style>
/* =========================================================
   设计 Token
   ========================================================= */
:root {
  /* ---- 颜色 · 背景 ---- */
  --bg:            #EEEDF4;  /* 页面底色：冷灰紫（原风格保留） */
  --bg-sub:        #EDE6F0;  /* 二级页底色：略偏粉（原风格保留） */
  --surface:       #F6F5F9;  /* 卡片/面板表面（原风格保留） */
  --surface-hover: #FBFAFD;  /* 卡片悬停表面（新增） */
  --hero-ink:      #3C4048;  /* Hero 暗区基色（原风格保留） */

  /* ---- 颜色 · 文字 ---- */
  --text-1:   #16161A;                  /* 一级文字（原风格保留） */
  --text-2:   #6B6B74;                  /* 二级文字（调整：原 #8C8C94 对比度不足） */
  --text-3:   #9A9AA3;                  /* 三级/禁用（新增） */
  --on-dark:  #FFFFFF;                  /* 暗底主文字 */
  --on-dark-2: rgba(255,255,255,.86);   /* 暗底次文字 */

  /* ---- 颜色 · 功能 ---- */
  --accent:       #5B5BD6;              /* kivo 品牌色：仅用于焦点环与「库内」标记（新增） */
  --fill-1:       rgba(22,22,26,.06);   /* 图标按钮底 */
  --fill-2:       rgba(22,22,26,.10);   /* 图标按钮悬停底 */
  --fill-active:  rgba(22,22,26,.07);   /* 导航选中块（原风格保留） */
  --dot:          rgba(255,255,255,.42);/* 分页点未激活 */
  --stroke-soft:  rgba(255,255,255,.75);/* 卡片 1px 内描边（原风格保留） */

  /* ---- 颜色 · 毛玻璃（原风格保留） ---- */
  --glass:        rgba(255,255,255,.58);
  --glass-stroke: rgba(255,255,255,.72);
  --glass-blur:   20px;

  /* ---- 颜色 · 评分源 ---- */
  --rate-imdb:   #F5C518;
  --rate-tmdb-a: #01B4E4;
  --rate-tmdb-b: #90CEA1;
  --rate-douban: #2E963D;

  /* ---- 字体 ----
     理想字体：中文 PingFang SC / 西文 SF Pro；Windows 落地建议 MiSans 或 HarmonyOS Sans SC */
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "MiSans",
          "HarmonyOS Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SF Mono", Consolas, monospace; /* 仅用于占位标注 */

  /* ---- 字号 ---- */
  --fs-11: 11px;  /* 角标 */
  --fs-12: 12px;  /* 导航标签 */
  --fs-13: 13px;  /* 副信息 */
  --fs-15: 15px;  /* 卡片标题 / Hero 简介 */
  --fs-16: 16px;  /* Hero 元信息 */
  --fs-20: 20px;  /* 二级页标题 / 分类名 */
  --fs-24: 24px;  /* 区块标题 */
  --fs-28: 28px;  /* 专题卡标题 */
  --fs-32: 32px;  /* 专题大图标题 */

  /* ---- 字重 ---- */
  --fw-regular: 400;
  --fw-medium:  500;
  --fw-semi:    600;
  --fw-bold:    700;

  /* ---- 行高 ---- */
  --lh-tight:  1.2;   /* 标题 */
  --lh-normal: 1.35;  /* 卡片文字 */
  --lh-loose:  1.6;   /* 段落（Hero 简介） */

  /* ---- 间距（4px 基准） ---- */
  --sp-4: 4px;  --sp-8: 8px;  --sp-12: 12px; --sp-16: 16px;
  --sp-24: 24px; --sp-32: 32px; --sp-56: 56px; --sp-72: 72px; --sp-80: 80px;
  --gap-card: 24px;       /* 卡片间距 */
  --gap-section: 56px;    /* 普通区块间距 */
  --gap-feature: 72px;    /* 专题区块上下间距 */

  /* ---- 圆角：卡片越大圆角越大（原风格规律） ---- */
  --r-poster: 12px;  /* 竖海报 */
  --r-card:   14px;  /* 横版卡 */
  --r-panel:  20px;  /* 大卡/专题/平台/公司 */
  --r-pill:   24px;  /* 分类胶囊 */
  --r-full:   999px; /* 导航/按钮/头像 */

  /* ---- 阴影（克制） ---- */
  --sh-poster: 0 4px 12px rgba(22,22,26,.16);  /* 海报墙小海报 */
  --sh-hover:  0 12px 28px rgba(22,22,26,.18); /* 悬停抬起（新增） */
  --sh-glass:  0 8px 24px rgba(0,0,0,.12);     /* 毛玻璃导航 */

  /* ---- 布局 ---- */
  --canvas: 1440px;
  --container: 1280px;

  /* ---- 动效 ---- */
  --ease: cubic-bezier(.2,.7,.2,1);
  --dur: 220ms;
}

/* =========================================================
   基础
   ========================================================= */
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-width: var(--canvas);
  background: var(--bg);
  color: var(--text-1);
  font-family: var(--font);
  font-size: var(--fs-15);
  line-height: var(--lh-normal);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.num { font-variant-numeric: tabular-nums; }  /* 日期/时长/评分统一等宽数字 */

.canvas { width: var(--canvas); margin: 0 auto; position: relative; }
.container { width: var(--container); margin: 0 auto; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(160%);
  backdrop-filter: blur(var(--glass-blur)) saturate(160%);
  border: 1px solid var(--glass-stroke);
  box-shadow: var(--sh-glass);
}

/* ---------------------------------------------------------
   图片占位：--h 色相 / --l 明度，模拟不同内容图
   --------------------------------------------------------- */
.ph {
  --h: 220; --l: 40%;
  position: relative; overflow: hidden;
  background:
    radial-gradient(120% 80% at 28% 18%, hsl(var(--h) 34% calc(var(--l) + 16%) / .9) 0%, transparent 60%),
    linear-gradient(160deg, hsl(var(--h) 26% var(--l)), hsl(calc(var(--h) + 28) 30% calc(var(--l) - 18%)));
}
.ph-tag {
  position: absolute; left: 8px; bottom: 8px; z-index: 1;
  font: 500 10px/1 var(--font-mono); letter-spacing: .02em;
  color: rgba(255,255,255,.8); background: rgba(0,0,0,.28);
  padding: 4px 6px; border-radius: 6px; white-space: nowrap;
}
.ph-tag--top { top: 8px; bottom: auto; }

/* =========================================================
   模块 0 · 顶部吸顶导航（原底部胶囊 → 桌面顶部）
   ========================================================= */
.topnav {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  width: var(--container); z-index: 50;
  display: flex; align-items: center; justify-content: space-between;
}
/* 品牌字标 */
.brand {
  height: 56px; padding: 0 24px; border-radius: var(--r-full);
  display: flex; align-items: center;
  font-size: 22px; font-weight: var(--fw-bold); letter-spacing: -.02em;
}
.brand i { font-style: normal; color: var(--accent); }
/* Tab 胶囊 */
.tabs {
  height: 68px; padding: 6px; border-radius: var(--r-full);
  display: flex; gap: 4px;
}
.tab {
  width: 104px; border-radius: var(--r-full);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: var(--fs-12); font-weight: var(--fw-semi); color: var(--text-1);
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.tab svg { width: 24px; height: 24px; }
.tab:hover { background: rgba(22,22,26,.04); }
.tab.is-active { background: var(--fill-active); }          /* 选中态 */
.tab:disabled { color: var(--text-3); cursor: not-allowed; } /* 禁用态（预留） */
.tab:disabled:hover { background: none; }
.avatar-mini {
  width: 24px; height: 24px; border-radius: 50%;
  background: linear-gradient(140deg, #9FB4D9, #5E6C8C);
  box-shadow: 0 0 0 1.5px #fff;
}
/* 独立搜索圆钮 */
.search-btn {
  width: 68px; height: 68px; border-radius: 50%;
  display: grid; place-items: center;
  transition: transform var(--dur) var(--ease);
}
.search-btn:hover { transform: scale(1.04); }
.search-btn svg { width: 26px; height: 26px; }

/* =========================================================
   模块 1 · Hero 轮播
   ========================================================= */
.hero { position: relative; height: 760px; overflow: hidden; background: var(--hero-ink); }
.hero-media { position: absolute; inset: 0; will-change: transform; --l: 36%; }
.hero-media .ph-tag { left: auto; right: 80px; bottom: auto; top: 108px; }
/* 两层遮罩：左侧压暗保文字可读 + 底部渐隐进页面底色 */
.hero-scrim {
  position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(180deg, rgba(238,237,244,0) 60%, var(--bg) 100%),   /* 上层：底部渐隐 */
    linear-gradient(90deg, rgba(20,22,26,.70) 0%, rgba(20,22,26,.38) 42%, rgba(20,22,26,0) 70%); /* 下层：左侧压暗 */
}
.hero-content {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: 176px; width: var(--container); color: var(--on-dark);
  display: flex; align-items: flex-end; justify-content: space-between;
}
.hero-text { width: 560px; }
/* 片名 Logo 位（落地时为透明 PNG） */
.hero-logo {
  width: 420px; height: 140px; border-radius: 12px;
  border: 1.5px dashed rgba(255,255,255,.38);
  position: relative; display: flex; align-items: center; padding-left: 24px;
  font-size: 64px; font-weight: var(--fw-bold); letter-spacing: .04em; line-height: 1;
}
.hero-logo .ph-tag { left: auto; right: 8px; }
.hero-meta {
  margin-top: var(--sp-24);
  font-size: var(--fs-16); font-weight: var(--fw-medium); line-height: var(--lh-normal);
  display: flex; align-items: center; gap: 10px;
}
.hero-meta .sep { width: 3px; height: 3px; border-radius: 50%; background: currentColor; opacity: .6; }
.hero-synopsis {
  margin: var(--sp-8) 0 0; color: var(--on-dark-2);
  font-size: var(--fs-15); line-height: var(--lh-loose);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
/* 评分行：无分数的源直接不渲染 */
.ratings { margin-top: var(--sp-16); display: flex; gap: 20px; }
.rating { display: flex; align-items: center; gap: 6px; font-size: var(--fs-15); font-weight: var(--fw-semi); }
.rate-badge {
  height: 16px; padding: 0 4px; border-radius: 3px;
  display: inline-grid; place-items: center;
  font-size: 9px; font-weight: 800; letter-spacing: .02em; line-height: 1;
}
.rate-badge.imdb   { background: var(--rate-imdb); color: #000; }
.rate-badge.tmdb   { background: linear-gradient(90deg, var(--rate-tmdb-b), var(--rate-tmdb-a)); color: #0D253F; }
.rate-badge.douban { background: var(--rate-douban); color: #fff; width: 16px; padding: 0; font-size: 10px; }
/* 分页点：激活为胶囊 */
.hero-dots { display: flex; align-items: center; gap: 8px; padding-bottom: 6px; }
.hero-dot {
  width: 8px; height: 8px; border-radius: var(--r-full); background: var(--dot);
  transition: width var(--dur) var(--ease), background var(--dur) var(--ease);
}
.hero-dot:hover { background: rgba(255,255,255,.72); }
.hero-dot.is-active { width: 24px; background: var(--on-dark); }

/* =========================================================
   通用 · 区块与区块标题行
   ========================================================= */
.home-body { position: relative; margin-top: -72px; padding-bottom: 140px; }
.section { margin-top: var(--gap-section); }
.section:first-child { margin-top: 0; }
.section-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: var(--sp-16); height: 36px;
}
.section-title { margin: 0; font-size: var(--fs-24); font-weight: var(--fw-semi); line-height: var(--lh-tight); }
.head-actions { display: flex; align-items: center; gap: var(--sp-8); }
.see-all {
  display: inline-flex; align-items: center; gap: 2px; margin-right: var(--sp-8);
  font-size: 14px; font-weight: var(--fw-medium); color: var(--text-2);
  transition: color var(--dur) var(--ease);
}
.see-all svg { width: 16px; height: 16px; }
.see-all:hover { color: var(--text-1); }
.icon-btn {
  width: 36px; height: 36px; border-radius: 50%; background: var(--fill-1);
  display: grid; place-items: center; transition: background var(--dur) var(--ease), opacity var(--dur);
}
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn:hover { background: var(--fill-2); }
.icon-btn:disabled { opacity: .35; cursor: default; background: var(--fill-1); } /* 禁用态 */

/* 横向卡片行：每屏恰好整列，箭头翻页 */
.row {
  --cols: 7;
  display: grid; grid-auto-flow: column;
  grid-auto-columns: calc((100% - (var(--cols) - 1) * var(--gap-card)) / var(--cols));
  gap: var(--gap-card);
  overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
  padding: 8px 0; margin: -8px 0;  /* 给悬停阴影留空间 */
}
.row::-webkit-scrollbar { display: none; }
.row > * { scroll-snap-align: start; min-width: 0; }

/* =========================================================
   组件 · 竖海报卡（热映/播出/动漫/列表页）
   ========================================================= */
.poster-card { display: block; }
.poster-card .ph {
  aspect-ratio: 2 / 3; border-radius: var(--r-poster);
  transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.poster-card:hover .ph { transform: translateY(-4px); box-shadow: var(--sh-hover); }
.card-title { margin-top: 10px; font-size: var(--fs-15); font-weight: var(--fw-medium); }
.card-meta  { margin-top: 2px; font-size: var(--fs-13); color: var(--text-2); }
/* 「库内已有」角标：kivo 专属，品牌色仅点在圆点上 */
.lib-chip {
  position: absolute; top: 8px; left: 8px; z-index: 1;
  height: 22px; padding: 0 8px; border-radius: var(--r-full);
  display: inline-flex; align-items: center; gap: 5px;
  font-size: var(--fs-11); font-weight: var(--fw-semi); color: #fff;
  background: rgba(22,22,26,.5);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.lib-chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #8E8CFF; }

/* =========================================================
   组件 · 继续观看卡（16:9）
   ========================================================= */
.cw-card { display: block; position: relative; }
.cw-media { aspect-ratio: 16 / 9; border-radius: var(--r-card); transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease); }
.cw-card:hover .cw-media { transform: translateY(-4px); box-shadow: var(--sh-hover); }
.cw-media::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0) 50%, rgba(0,0,0,.55) 100%);
}
.cw-remain {
  position: absolute; left: 16px; bottom: 22px; z-index: 1;
  font-size: var(--fs-13); font-weight: var(--fw-medium); color: #fff;
}
.cw-progress {
  position: absolute; left: 16px; right: 16px; bottom: 12px; z-index: 1;
  height: 4px; border-radius: 2px; background: rgba(255,255,255,.4); overflow: hidden;
}
.cw-progress span { display: block; height: 100%; background: #fff; border-radius: 2px; }
/* 「…」菜单：悬停/聚焦时出现 */
.cw-more {
  position: absolute; top: 10px; right: 10px; z-index: 2;
  width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center; color: #fff;
  background: rgba(22,22,26,.42);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  opacity: 0; transition: opacity var(--dur) var(--ease), background var(--dur);
}
.cw-more svg { width: 18px; height: 18px; }
.cw-card:hover .cw-more, .cw-more:focus-visible { opacity: 1; }
.cw-more:hover { background: rgba(22,22,26,.62); }
.cw-title { margin-top: 12px; display: flex; align-items: baseline; gap: 8px; }
.cw-title b { font-size: var(--fs-15); font-weight: var(--fw-medium); }
.cw-title span { font-size: var(--fs-13); color: var(--text-2); }

/* =========================================================
   组件 · 横版趋势卡（9:5）
   ========================================================= */
.wide-card { display: block; }
.wide-card .ph {
  aspect-ratio: 9 / 5; border-radius: var(--r-card);
  transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.wide-card:hover .ph { transform: translateY(-4px); box-shadow: var(--sh-hover); }
.wide-card .card-title { margin-top: 12px; }

/* =========================================================
   模块 6 · 专题大卡（本月 · 热门综艺）
   ========================================================= */
.feature {
  margin: var(--gap-feature) auto; border-radius: var(--r-panel); overflow: hidden;
  background: var(--surface); border: 1px solid var(--stroke-soft);
}
.feature-media { display: block; height: 420px; --h: 32; --l: 52%; }
.feature-media::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(0,0,0,.55) 100%);
}
.feature-caption {
  position: absolute; left: 0; right: 0; bottom: 32px; z-index: 1;
  text-align: center; color: #fff;
}
.feature-caption h3 {
  margin: 0; display: inline-flex; align-items: center; gap: 16px;
  font-size: var(--fs-32); font-weight: var(--fw-bold); line-height: var(--lh-tight);
}
.feature-caption h3 svg { width: 22px; height: 40px; opacity: .9; }
.feature-caption p { margin: 8px 0 0; font-size: 14px; color: var(--on-dark-2); }
.feature-body { padding: 24px 28px 28px; }
.feature-body .row { --cols: 4; }

/* =========================================================
   模块 8 · 热门人物（圆形头像，例外：居中对齐）
   ========================================================= */
.row--people { --cols: 8; }
.person { display: block; text-align: center; }
.person .ph {
  width: 128px; height: 128px; margin: 0 auto; border-radius: 50%; --l: 46%;
  transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.person:hover .ph { transform: translateY(-4px); box-shadow: var(--sh-hover); }
.person .ph-tag { left: 50%; transform: translateX(-50%); bottom: 14px; }
.person .card-title { margin-top: 12px; }

/* =========================================================
   模块 9 · 播出平台（logo + 倾斜海报拼贴）
   ========================================================= */
.row--platform { --cols: 2; }
.platform {
  position: relative; height: 220px; border-radius: var(--r-panel); overflow: hidden;
  background: var(--surface); border: 1px solid var(--stroke-soft);
  display: flex; align-items: center; padding-left: 40px;
  transition: background var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.platform:hover { background: var(--surface-hover); box-shadow: var(--sh-hover); }
.logo-slot {
  width: 200px; height: 64px; border-radius: 10px;
  border: 1.5px dashed rgba(22,22,26,.22); color: var(--text-2);
  display: grid; place-items: center; text-align: center;
  font: 500 11px/1.4 var(--font-mono);
}
.collage {
  position: absolute; right: -36px; top: -70px; width: 330px;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
  transform: rotate(-14deg);
}
.collage .ph { aspect-ratio: 2 / 3; border-radius: 10px; box-shadow: var(--sh-poster); }

/* =========================================================
   模块 10 · 分类浏览（胶囊）
   ========================================================= */
.cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap-card); }
.cat-pill {
  --tint: 220;
  height: 124px; border-radius: var(--r-pill); padding: 0 32px 0 28px;
  display: flex; align-items: center; justify-content: space-between;
  background: linear-gradient(120deg, hsl(var(--tint) 40% 94%), var(--surface));
  border: 1px solid var(--stroke-soft);
  transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.cat-pill:hover { transform: translateY(-3px); box-shadow: var(--sh-hover); }
.cat-stack { position: relative; width: 96px; height: 92px; }
.cat-stack .ph {
  position: absolute; top: 0; width: 64px; height: 92px; border-radius: 8px; box-shadow: var(--sh-poster);
}

  <a class="poster-card" href="#">
    <div class="ph" style="--h:${h ?? hueOf(i)}">${inLib ? '<span class="lib-chip">库内</span>' : ''}<span class="ph-tag">海报 2:3</span></div>
    <div class="card-title ellipsis">${title}</div>
    <div class="card-meta ellipsis num">${meta}</div>
  </a>`;

/* 横版卡 */
const wideCard = ([title, meta, h], i) => `
  <a class="wide-card" href="#">
    <div class="ph" style="--h:${h ?? hueOf(i)};--l:44%"><span class="ph-tag">剧照 9:5</span></div>
    <div class="card-title ellipsis">${title}</div>
    <div class="card-meta ellipsis num">${meta}</div>
  </a>`;

/* 继续观看卡 */
const cwCard = c => `
  <a class="cw-card" href="#">
    <div class="cw-media ph" style="--h:${c.h};--l:38%">
      <span class="ph-tag ph-tag--top">剧照 16:9</span>
      <span class="cw-remain num">${c.remain}</span>
      <div class="cw-progress"><span style="width:${c.p * 100}%"></span></div>
    </div>
    <button class="cw-more" aria-label="更多操作" onclick="event.preventDefault()"><svg><use href="#i-more"/></svg></button>
    <div class="cw-title"><b class="ellipsis">${c.t}</b>${c.ep ? `<span class="num">${c.ep}</span>` : ''}</div>
    <div class="card-meta num">${c.when} · ${c.src}</div>
  </a>`;

/* 人物卡 */
const personCard = ([name, work], i) => `
  <a class="person" href="#">
    <div class="ph" style="--h:${hueOf(i + 3)}"><span class="ph-tag">头像 1:1</span></div>
    <div class="card-title ellipsis">${name}</div>
    <div class="card-meta ellipsis">代表作 · ${work}</div>
  </a>`;

/* 平台卡 */
const platformCard = (name, i) => `
  <a class="platform" href="#">
    <div class="logo-slot">${name}<br>Logo 位 · 200×64</div>
    <div class="collage">${Array.from({ length: 9 }, (_, k) => `<div class="ph" style="--h:${hueOf(i * 9 + k)};--l:42%"></div>`).join('')}</div>
  </a>`;

function fill(id, html) { $(id).innerHTML = html; }
fill('#rowContinue', CONTINUE.map(cwCard).join(''));
fill('#rowNow', NOW.map(posterCard).join(''));
fill('#rowAir', AIR.map(posterCard).join(''));
fill('#rowTrend', TREND.map(wideCard).join(''));
fill('#rowVariety', VARIETY.map(wideCard).join(''));
fill('#rowAnime', ANIME.map(posterCard).join(''));
fill('#rowPeople', PEOPLE.map(personCard).join(''));
fill('#rowPlatform', PLATFORMS.map(platformCard).join(''));
fill('#catGrid', CATS.map(([n, h]) => `
  <a class="cat-pill" href="#" style="--tint:${h}">
    <div class="cat-stack">${[0, 1, 2].map(k => `<div class="ph" style="--h:${(h + k * 25) % 360};--l:44%"></div>`).join('')}</div>
    <span class="cat-name">${n}</span>
  </a>`).join(''));
fill('#wallRows', [0, 1, 2].map(r => `
  <div class="wall-row">${Array.from({ length: 12 }, (_, k) => `<div class="ph" style="--h:${hueOf(r * 12 + k + 5)};--l:42%"></div>`).join('')}</div>`).join(''));
fill('#studioGrid', STUDIOS.map(([n, h]) => `
  <a class="studio ph" href="#" style="--h:${h}">
    <span class="ph-tag ph-tag--top">剧照底图 · 416×200</span>
    <div class="logo-slot">${n}<br>Logo 位 · 白色单色</div>
  </a>`).join(''));

/* ======================= Hero 轮播 ======================= */
const RATE_LABEL = { imdb:'IMDb', tmdb:'TMDB', douban:'豆' };
function setSlide(i) {
  const s = HERO[i];
  $('#heroMedia').style.setProperty('--h', s.h);
  $('#heroLogoText').textContent = s.t;
  $('#heroMeta').innerHTML = `<span>${s.g}</span><span class="sep"></span><span>${s.d}</span>`;
  $('#heroSynopsis').textContent = s.s;
  $('#heroRatings').innerHTML = Object.entries(s.r)
    .map(([k, v]) => `<span class="rating"><span class="rate-badge ${k}">${RATE_LABEL[k]}</span>${v.toFixed(1)}</span>`).join('');
  document.querySelectorAll('.hero-dot').forEach((d, k) => {
    d.classList.toggle('is-active', k === i);
    d.setAttribute('aria-selected', k === i);
  });
}
$('#heroDots').innerHTML = HERO.map((_, i) => `<button class="hero-dot" role="tab" aria-label="第 ${i + 1} 张"></button>`).join('');
document.querySelectorAll('.hero-dot').forEach((d, i) => d.addEventListener('click', () => setSlide(i)));
setSlide(0);

/* 滚动时：Hero 视差 + 文字淡出（原风格保留；落地可简化为仅淡出） */
addEventListener('scroll', () => {
  if (document.body.classList.contains('view-list')) return;
  const p = Math.min(scrollY / 600, 1);
  $('#heroMedia').style.transform = `translateY(${p * 120}px)`;
  $('#heroContent').style.opacity = 1 - p * 1.1;
}, { passive: true });

/* ======================= 行翻页（含禁用态） ======================= */
document.querySelectorAll('.section').forEach(sec => {
  const row = sec.querySelector('.row'), prev = sec.querySelector('.js-prev'), next = sec.querySelector('.js-next');
  if (!row || !prev) return;
  const sync = () => {
    prev.disabled = row.scrollLeft <= 1;
    next.disabled = row.scrollLeft + row.clientWidth >= row.scrollWidth - 1;
  };
  prev.onclick = () => row.scrollBy({ left: -(row.clientWidth + 24), behavior: 'smooth' });
  next.onclick = () => row.scrollBy({ left: row.clientWidth + 24, behavior: 'smooth' });
  row.addEventListener('scroll', sync, { passive: true });
  sync();
});

/* ======================= 导航选中态 ======================= */
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(o => { o.classList.remove('is-active'); o.setAttribute('aria-selected', 'false'); });
  t.classList.add('is-active'); t.setAttribute('aria-selected', 'true');
}));

/* ======================= 二级列表页 ======================= */
const LIST_SOURCE = { '继续观看':['wide', CONTINUE.map(c => [c.t, `${c.when} · ${c.src}`, c.h])],
  '正在热映':['poster', NOW], '正在播出':['poster', AIR], '本周趋势':['wide', TREND],
  '今日动漫':['poster', ANIME], '热门人物':['poster', PEOPLE.map(([n, w]) => [n, '代表作 · ' + w])] };
document.querySelectorAll('.see-all').forEach(a => a.addEventListener('click', e => {
  e.preventDefault();
  const title = a.closest('.section').querySelector('.section-title').textContent;
  const [kind, data] = LIST_SOURCE[title];
  const items = Array.from({ length: kind === 'wide' ? 12 : 21 }, (_, i) => data[i % data.length]);
  $('#listTitle').textContent = title;
  $('#listGrid').className = 'list-grid' + (kind === 'wide' ? ' is-wide' : '');
  $('#listGrid').innerHTML = items.map((d, i) => (kind === 'wide' ? wideCard : posterCard)(d, i)).join('');
  document.body.classList.add('view-list'); scrollTo(0, 0);
}));
$('#listBack').onclick = () => { document.body.classList.remove('view-list'); scrollTo(0, 0); };
</script>
</body>
</html>
